<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absensi Generus</title>
<style>
:root{--bg:#FCFAF4;--card:#FFFFFF;--tx:#26332E;--mu:#6d7a73;--pr:#187A5A;--ac:#D6B45C;--ok:#187A5A;--bd:#e8e3d3;--no:#c2410c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header{background:var(--pr);color:#fff;padding:16px 18px;border-bottom:4px solid var(--ac)}
header h1{margin:0;font-size:19px}header p{margin:2px 0 0;font-size:13px;opacity:.85}
main{max-width:760px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.stat b{display:block;font-size:26px}.stat span{color:var(--mu);font-size:13px}
h2{font-size:16px;margin:0 0 10px}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;max-width:100%}
input{width:100%}
button{cursor:pointer}.pr{background:var(--pr);color:#fff;border-color:var(--pr);font-weight:600}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1}.row>button{flex:0 0 auto}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--bd)}
.li:first-of-type{border-top:0}
.li small{color:var(--mu);display:block}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--ac))}
.msg{padding:10px 12px;border-radius:10px;margin:8px 0;font-size:14px}
.msg.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.msg.no{background:color-mix(in srgb,var(--no) 15%,transparent);color:var(--no)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:9px 2px;font-size:11px;color:var(--mu);text-decoration:none;cursor:pointer}
nav a span{display:block;font-size:19px}nav a.on{color:var(--pr);font-weight:600;box-shadow:inset 0 3px 0 var(--ac)}
video{width:100%;border-radius:10px;margin-top:8px}
.ck{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:14px}.ck input{width:auto}
.del{color:var(--no);border-color:var(--bd)}
#sp{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto;border-top:6px solid var(--ac)}
#sp img{width:min(78vw,340px);height:auto;mix-blend-mode:multiply}
#sp .ar{font:700 clamp(28px,8vw,40px)/1.7 'Amiri','Noto Naskh Arabic','Traditional Arabic','Geeza Pro',serif;color:var(--pr);margin:6px 0 0}
#sp p{margin:2px 0 18px;color:var(--mu);font-size:13px}
#sp button{padding:12px 36px;font-size:16px;border-radius:99px;background:var(--pr);color:#fff;border:2px solid var(--ac);font-weight:600}
#sp.out{display:none}

.top{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.av{width:48px;height:48px;border-radius:12px;background:var(--pr);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;border:2px solid var(--ac);flex:0 0 48px}
.top .w{flex:1;min-width:0}.top small{color:var(--mu);display:block}.top b{font-size:19px}
.rb{width:44px;height:44px;border-radius:12px;padding:0;display:grid;place-items:center;flex:0 0 44px}
.hero{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--ac) 16%,var(--card));border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--bd);overflow:hidden}
.hero .t{flex:1}.hero .ar{font:700 22px/1.8 'Amiri','Noto Naskh Arabic','Geeza Pro',serif;color:var(--pr);direction:rtl;text-align:right;margin:0}
.hero p{margin:6px 0 2px}.hero small{color:var(--mu)}.hero img{width:108px;mix-blend-mode:multiply}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 4px;margin-bottom:12px}
.mg a{text-align:center;font-size:11px;cursor:pointer}.mg a i{width:46px;height:46px;border-radius:12px;background:var(--pr);color:#fff;display:grid;place-items:center;margin:0 auto 5px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{white-space:nowrap;border-radius:10px;background:var(--card);flex:0 0 auto}.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.gc h3{margin:0;font-size:17px}.gc .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.acts button{padding:8px 14px;font-size:13px}

#tour{position:fixed;inset:0;z-index:98;display:none;flex-direction:column;background:rgba(10,20,16,.5)}
#tour .tb{flex:1}
#tour .ts{background:var(--card);border-radius:14px 14px 0 0;padding:16px 20px calc(18px + env(safe-area-inset-bottom,0px));text-align:center;max-width:520px;width:100%;margin:0 auto;border:1px solid var(--bd);border-bottom:0}
.td{display:flex;gap:6px;justify-content:center;margin-bottom:18px}.td i{width:14px;height:4px;background:var(--bd)}.td i.on{width:26px;background:var(--pr)}
.tic{width:68px;height:68px;margin:0 auto 12px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 22%,var(--card));color:var(--pr);border-radius:12px}
#tour h2{font-size:19px;margin:0 0 6px}#tour p{margin:0 0 18px;color:var(--mu)}
.tbn{display:flex;gap:10px}.tbn button{flex:1;padding:13px}
.tl{display:block;margin-top:12px;color:var(--mu);font-size:14px;cursor:pointer}

#tour .ts{max-height:86vh;overflow:auto}
.kl{list-style:none;padding:0;margin:0 0 16px;text-align:left}.kl li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}.kl b{flex:0 0 30px;color:var(--pr)}
.mh{margin:6px 2px 8px;font-size:16px}
.ft{text-align:center;font:700 24px/2 'Amiri','Noto Naskh Arabic','Geeza Pro',serif;color:var(--pr);margin:18px 0 4px}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">
</head>

function kl(){var o={};S.m.forEach(function(m){if(m.k&&m.k!=='-')o[m.k]=1});S.tg.forEach(function(t){if(t.k!=='*')o[t.k]=1});return Object.keys(o).sort(cmp)}
function mt(m){return S.tg.filter(function(t){return t.k==='*'||t.k===m.k}).sort(function(x,y){return cmp(x.j,y.j)})}
function dn(mid,tid){return S.pr.find(function(p){return p.id===mid&&p.t===tid})}
function aT(){var j=val('tj');if(!j)return;var o={id:'T'+Date.now().toString(36),k:tk,j:j};S.tg.push(o);op('PUT','/tg/'+o.id,o);render()}
function dT(id){if(!confirm('Hapus target ini?'))return;S.pr.filter(function(p){return p.t===id}).forEach(function(p){op('DELETE','/pr/'+p.id+'_'+id)});S.pr=S.pr.filter(function(p){return p.t!==id});S.tg=S.tg.filter(function(t){return t.id!==id});op('DELETE','/tg/'+id);render()}
function tp(mid,tid){var h=dn(mid,tid),k=mid+'_'+tid;if(h){S.pr=S.pr.filter(function(x){return x!==h});op('DELETE','/pr/'+k)}else{var o={id:mid,t:tid,by:me};S.pr.push(o);op('PUT','/pr/'+k,o)}render()}

function sc(v){var i=document.getElementById('kd');v=(v||i.value).trim().toUpperCase();if(!v)return;

function add(){var n=val('nn'),k=val('nk');if(!n)return;
 var x=1;while(S.m.some(function(m){return m.id==='G'+String(x).padStart(3,'0')}))x++;
 var o={id:'G'+String(x).padStart(3,'0'),n:n,k:k||'-'};S.m.push(o);op('PUT','/m/'+o.id,o);render()}
function rmM(id){if(!confirm('Hapus '+nm(id)+'?'))return;
 S.a.filter(function(a){return a.id===id}).forEach(function(a){op('DELETE','/a/'+id+'_'+a.d)});
 S.pr.filter(function(p){return p.id===id}).forEach(function(p){op('DELETE','/pr/'+id+'_'+p.t)});S.pr=S.pr.filter(function(p){return p.id!==id});S.m=S.m.filter(function(m){return m.id!==id});S.a=S.a.filter(function(a){return a.id!==id});op('DELETE','/m/'+id);render()}
async function cam(){
 try{if(!('BarcodeDetector' in window))throw 0;
  var st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),v=document.getElementById('vd'),d=new BarcodeDetector({formats:['qr_code']});

   d.detect(v).then(function(r){if(r.length){st.getTracks().forEach(function(t){t.stop()});sc(r[0].rawValue)}else setTimeout(lp,300)}).catch(function(){setTimeout(lp,300)})})();
 }catch(e){note=['no','Kamera/scan QR tidak tersedia di perangkat ini. Ketik kode secara manual.'];render()}}
setInterval(function(){var e=document.activeElement;if(AU&&AU.ev&&WS&&!(e&&(e.tagName==='INPUT'||e.tagName==='SELECT')))boot().then(render)},7000);
render();
if(AU)chkV().then(function(ok){return ok?boot():0}).then(render).catch(function(e){WHY=why(e);stat(false);render()});
